extends: default

ignore: |
  target/
  dbt_packages/
  logs/
  .venv/

rules:
  document-start: disable
  line-length: {max: 160, level: warning}
  comments: {min-spaces-from-content: 1}
  comments-indentation: disable
  indentation: {spaces: 2, indent-sequences: consistent}
  braces: {max-spaces-inside: 1}
  brackets: {max-spaces-inside: 1}
  colons: {max-spaces-after: -1}            # we align values in column lists
  commas: {max-spaces-after: -1}            # ... and after commas in inline column specs
  truthy: {allowed-values: ['true', 'false', 'on'], check-keys: false}   # GitHub's "on:" key
